name: Edit Places of Interest (Tags)
description: Add or remove places of interest for a bus route
title: "Edit Tags"
labels: ["tags"]
body:
  - type: markdown
    attributes:
      value: "Places along or near the route. They are shown on the site and used by the search. They do not need to be confirmed bus stops."
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: The tab where the bus is listed on the site
      options:
        - KK Local Buses
        - KK Local Link
        - KK BAS.MY
        - Intercity
    validations:
      required: true
  - type: input
    id: uid
    attributes:
      label: UID
      description: "Shown on each bus card on the site. For several buses in the same category, separate UIDs with commas. The same tag changes apply to all of them."
      placeholder: "005, 006, 007"
    validations:
      required: true
  - type: textarea
    id: tags_add
    attributes:
      label: Tags to add
      description: "Add the names people might know, including both short and full names, separated by commas or new lines. Repeats that differ only in capitals, spaces or punctuation are skipped."
      placeholder: "Inanam Market, Hospital QE"
  - type: textarea
    id: tags_remove
    attributes:
      label: Tags to remove
      description: Separate with commas or new lines
